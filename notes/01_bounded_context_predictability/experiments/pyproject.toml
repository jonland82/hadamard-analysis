[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadamard-note1"
version = "0.1.0"
description = "Experiments for bounded-context prediction in row-major Hadamard matrices"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
hadamard-note1 = "hadamard_note1.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
